<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes objets — Les Cavernes de Hammerfest</title>
<link rel="stylesheet" href="hf.css">
<style>
  /* ── Frigo (fiche Hammerfest d'Eternalfest) ───────────────────────────── */
  .player-stats {
    width: 360px;
    max-width: 100%;
    margin: 10px auto 0;
    display: grid;
    grid-template-columns: auto auto;
    column-gap: 10px;
    row-gap: 4px;
  }
  .player-stats dt { padding-top: 3px; font-weight: bold; text-align: right; }
  .player-stats > div { display: contents; }
  .player-stats dd { margin: 0; font-size: 12pt; font-weight: bold; color: var(--accent); }

  .items-count {
    width: 360px;
    max-width: 100%;
    margin: 20px auto 0;
    font-size: 10pt;
    font-weight: bold;
    color: var(--accent);
    text-align: left;
    padding-bottom: 2px;
    border-bottom: 1px dotted #888;
  }
  .items {
    list-style: none;
    padding: 0;
    width: 360px;
    max-width: 100%;
    margin: 4px auto 0;
    font-size: 0;
  }
  .items li {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    vertical-align: top;
    width: 26px;
    height: 36px;
    margin: 2px;
  }
  .items li img { width: 26px; height: 26px; }
  .items li img.not-unlocked { filter: grayscale(100%); opacity: 0.4; }
  .item-count {
    font-size: 9px;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold;
    text-align: center;
    width: 100%;
    line-height: 1;
    color: #8f201e;
    text-shadow: -1px -1px 0 #ffeef0, 1px -1px 0 #ffeef0, -1px 1px 0 #ffeef0, 1px 1px 0 #ffeef0;
  }
  .item-count.not-unlocked { color: #aaa; text-shadow: none; }
  .unknown-item { font-size: 14px; font-weight: bold; color: #aaa; line-height: 36px; }

  /* ── Mes objets (item-table d'Eternalfest) ────────────────────────────── */
  .item-stats {
    display: grid;
    grid-template-columns: max-content max-content;
    column-gap: 16px;
    row-gap: 6px;
    margin: 16px auto 20px;
    width: max-content;
  }
  .item-stats > div { display: contents; }
  .item-stats dt { font-size: 10pt; font-weight: bold; padding-top: 2px; }
  .item-stats dd { margin: 0; font-size: 12pt; font-weight: bold; color: var(--accent); }

  .item-families { margin-top: 20px; }
  .item-family {
    display: flex;
    flex-direction: column;
    width: 460px;
    max-width: 100%;
    margin: 0 auto 16px;
    border-inline: 1px solid #8f201e;
  }
  .item-family-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 8px;
    font-size: 9pt;
    font-weight: bold;
    background-color: rgba(232, 176, 179, 0.55);
    border-top: 1px solid #8f201e;
    color: #8f201e;
  }
  .item-family-name { flex: 1; min-width: 0; letter-spacing: 0.4px; }
  .item-family-name-text { text-transform: uppercase; }
  .item-family-progress { flex-shrink: 0; white-space: nowrap; color: var(--accent); }
  .item-family-complete { flex-shrink: 0; white-space: nowrap; font-style: italic; }

  .item-row {
    display: grid;
    grid-template-columns: 30px 60px 1fr;
    align-items: center;
    border-bottom: 1px dashed rgba(143, 32, 30, 0.25);
  }
  .item-row:last-child { border-bottom: 1px solid #8f201e; }
  .item-row .icon { padding: 2px 4px; display: flex; align-items: center; }
  .item-row .icon img { width: 24px; height: 24px; }
  .item-row .count {
    padding: 2px 12px 2px 4px;
    font-size: 9pt;
    font-weight: bold;
    color: var(--accent);
    white-space: nowrap;
  }
  .item-row .name { padding: 2px 4px 2px 10px; font-size: 9pt; }
  .item-row.locked .icon img { filter: grayscale(100%); opacity: 0.4; }
  .item-row.locked .name { color: #a34a48; }

  /* ── Mes quêtes (quest.component + tableaux globaux) ──────────────────── */
  .quest { margin: 0 auto 16px; }
  .quest table { width: 100%; }
  .quest thead th span,
  .quest thead th p { display: block; text-align: left; padding: 5px; }
  .quest thead th .name { font-size: 1.2em; font-weight: bold; }
  .quest thead th .status { float: right; font-weight: bold; }
  .quest thead th .description { margin: 0; font-size: 9pt; font-weight: normal; }
  .quest td.icon,
  .quest td.count { width: 15%; }
  .quest td.icon img { width: 26px; height: 26px; vertical-align: middle; }
  .quest.completed .status { color: #2f6b4a; }
</style>
</head>
<body>
<main class="sheet">
  <div class="page-head">
    <h1 class="game-name" id="page-title">Les Cavernes de Hammerfest</h1>
    <nav class="game-tabs">
      <a class="blurred" href="play.html">Jeu</a>
      <a class="blurred" href="leaderboard.html">Classement</a>
      <a class="blurred" href="profile.html#frigo" id="tab-frigo">Frigo</a>
      <a class="blurred" href="profile.html#objets" id="tab-objets">Mes objets</a>
      <a class="blurred" href="profile.html#quetes" id="tab-quetes">Mes quêtes</a>
    </nav>
  </div>

  <div class="content">
    <div class="notice" id="notice">Chargement…</div>

    <section id="section-frigo" hidden>
      <dl class="player-stats" id="player-stats"></dl>
      <div class="items-count" id="items-count"></div>
      <ul class="items" id="fridge"></ul>
    </section>

    <section id="section-objets" hidden>
      <dl class="item-stats" id="item-stats"></dl>
      <div class="item-families" id="families"></div>
    </section>

    <section id="section-quetes" hidden>
      <div id="quests"></div>
    </section>
  </div>

  <footer>
    Hammerfest © Motion Twin — corrections et contenu : Eternalfest — lecteur : Ruffle.
    Version non officielle hébergée sur THOMZY.com.
  </footer>
</main>
<script type="module" src="/games/hammerfest/client/profile.js"></script>
</body>
</html>
